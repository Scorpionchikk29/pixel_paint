<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Пиксельный Конвертер PRO</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Пиксельный конвертер изображений</h1>

        <div class="controls">
            <div class="control-group">
                <label for="imageLoader">1. Выберите файл:</label>
                <input type="file" id="imageLoader" accept="image/*" />
            </div>
            <div class="control-group">
                <label for="complexity">2. Разрешение сетки:</label>
                <select id="complexity">
                    <option value="64">64 x 64</option>
                    <option value="128" selected>128 x 128</option>
                    <option value="256">256 x 256</option>
                </select>
            </div>
            <div class="control-group">
                <label for="colorCount">3. Количество цветов:</label>
                <select id="colorCount">
                    <option value="8">8 цветов</option>
                    <option value="16">16 цветов</option>
                    <option value="24">24 цвета</option>
                    <option value="32" selected>32 цвета (Макс)</option>
                </select>
            </div>
            <div class="control-group" style="justify-content: flex-end">
                <button
                    id="directLoadJsonBtn"
                    class="btn btn-secondary"
                    style="background: #3b82f6; color: white; padding: 8px 15px"
                >
                    📂 Загрузить из .JSON
                </button>
            </div>
        </div>

        <!-- Модальное окно кадрирования (выбор ракурса) -->
        <div id="cropModal" class="modal">
            <div class="modal-content">
                <h3>Настройка ракурса (Обрезать изображение)</h3>
                <p>
                    Перетаскивайте рамку или меняйте её размер за правый нижний
                    угол.
                </p>
                <div class="crop-area-wrapper">
                    <canvas id="cropCanvas"></canvas>
                    <div id="cropFrame"></div>
                </div>
                <div class="modal-buttons">
                    <button id="cancelCropBtn" class="btn btn-secondary">
                        Отмена
                    </button>
                    <button id="confirmCropBtn" class="btn btn-primary">
                        Пикселизировать
                    </button>
                </div>
            </div>
        </div>

        <!-- Область предпросмотра результата -->
        <div id="preview-container" class="hidden">
            <div id="palette-wrapper">
                <h3>Выберите цвет:</h3>
                <div id="palette"></div>

                <!-- Блок управления сохранением -->
                <div
                    class="save-controls"
                    style="
                        margin-top: 20px;
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                    "
                >
                    <button
                        id="saveProgressBtn"
                        class="btn btn-primary"
                        style="
                            background: #10b981;
                            font-size: 13px;
                            padding: 8px;
                        "
                    >
                        💾 Сохранить в файл
                    </button>
                    <button
                        id="loadProgressBtn"
                        class="btn btn-secondary"
                        style="font-size: 13px; padding: 8px"
                    >
                        📂 Загрузить из файла
                    </button>
                    <button
                        id="resetProgressBtn"
                        class="btn btn-secondary"
                        style="
                            background: #ef4444;
                            color: white;
                            font-size: 13px;
                            padding: 8px;
                        "
                    >
                        🗑️ Сбросить раскраску
                    </button>
                    <input
                        type="file"
                        id="progressFileLoader"
                        accept=".json"
                        style="display: none"
                    />
                </div>
            </div>
            <div id="canvas-wrapper">
                <h3>Результат:</h3>
                <canvas id="resultCanvas"></canvas>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
